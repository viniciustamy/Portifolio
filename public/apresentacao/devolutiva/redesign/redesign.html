  <script src="vendor/echarts.min.js"></script>

  <script src="redesign-charts.js"></script>
  <script>
    // Clicar fora da modal (no fundo escurecido) fecha
    document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

    // Ajustes de interação que o visual pede, aplicados a cada tela renderizada
    (() => {
      const app = document.getElementById('app');
      const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

      // Filtro de área: popover próprio no lugar da lista nativa do navegador (o select continua sendo a fonte do valor)
      const enhanceArea = label => {
        if (label.dataset.enhanced) return;
        label.dataset.enhanced = '1';
        const select = label.querySelector('select');
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'area-trigger';
        const pop = document.createElement('div');
        pop.className = 'area-popover';
        pop.setAttribute('role', 'listbox');
        const sync = () => { trigger.innerHTML = `<span>${select.options[select.selectedIndex].text}</span>${chevron}`; };
        [...select.options].forEach((opt, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'area-option';
          b.textContent = opt.text;
          b.addEventListener('click', e => {
            e.stopPropagation();
            select.selectedIndex = i;
            select.dispatchEvent(new Event('change', { bubbles: true }));
            select.dispatchEvent(new Event('input', { bubbles: true }));
            pop.querySelectorAll('.area-option').forEach((o, j) => o.setAttribute('aria-selected', j === i));
            label.classList.remove('is-open');
            sync();
          });
          b.setAttribute('aria-selected', i === select.selectedIndex);
          pop.appendChild(b);
        });
        label.addEventListener('click', e => { e.preventDefault(); label.classList.toggle('is-open'); });
        select.after(trigger, pop);
        sync();
      };
      document.addEventListener('click', e => {
        document.querySelectorAll('.rh-area-filter.is-open').forEach(l => { if (!l.contains(e.target)) l.classList.remove('is-open'); });
      });

      // Tabela do gestor: clicar em qualquer parte da linha abre a ação da pessoa
      app.addEventListener('click', e => {
        const row = e.target.closest('.manager-team-table tbody tr');
        if (!row || e.target.closest('a,button')) return;
        row.querySelector('td.end a, td.end button')?.click();
      });

      const enhance = () => {
        app.querySelectorAll('.rh-area-filter').forEach(enhanceArea);
        app.querySelectorAll('input[type="search"], .rh-search input, #team-search, #search').forEach(i => i.setAttribute('autocomplete', 'off'));
      };
      new MutationObserver(enhance).observe(app, { childList: true, subtree: true });
      enhance();
    })();
  </script>
