    top: 8%;
    left: 17.5%;

    transform: scale(0.65);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.18));
    z-index: 1;
    transition: left .55s cubic-bezier(0.22, 1, 0.36, 1),

                transform .55s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .motion-wrap:hover .card-esq {
    left: -35%;
    top: 8%;

  .motion-wrap:hover .card-dir {
    left: 75%;
    top: 8%;
    opacity: 1;
    transform: scale(1);
  }
  .laptop {
    position: relative;
    width: 100%;
    z-index: 2;
  }
  .laptop img { width: 100%; display: block; }
